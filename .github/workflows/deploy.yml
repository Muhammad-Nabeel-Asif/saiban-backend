name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/saiban-backend
            git fetch origin main
            git reset --hard origin/main
            npm install --production=false
            npm run build
            pm2 startOrReload ecosystem.config.js --update-env
            for i in {1..15}; do
              if curl -fsS http://127.0.0.1:4000/api/health >/dev/null; then
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "Production health check failed after reload"
                exit 1
              fi
              sleep 2
            done
            for i in {1..15}; do
              if curl -fsS http://127.0.0.1:4001/api/health >/dev/null; then
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "Staging health check failed after reload"
                exit 1
              fi
              sleep 2
            done
            pm2 save
